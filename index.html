<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Pink Heart 3D</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%97%3C/text%3E%3C/svg%3E" />
  <meta name="description" content="Trái tim 3D từ hàng chục nghìn hạt phát sáng" />

  <!-- Font chữ viết tay có hỗ trợ tiếng Việt -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet" />

  <style>
    /* ====== CẤU HÌNH NHANH: đổi màu chữ / glow tại đây ====== */
    :root {
      --text-color: #ffd6ec;
      --glow-light: #ff9ecf;
      --glow-strong: #ff2e88;
      --bg-color: #05010a;
    }

    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: var(--bg-color);
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
    }

    #scene {
      position: fixed;
      inset: 0;
      display: block;
    }

    /* Dòng chữ phát sáng phía dưới trái tim */
    #message {
      position: fixed;
      left: 0;
      right: 0;
      bottom: max(8vh, 40px);
      padding: 0 16px;
      text-align: center;
      font-family: "Dancing Script", cursive;
      font-weight: 700;
      font-size: clamp(30px, 8vw, 64px);
      color: var(--text-color);
      text-shadow:
        0 0 6px var(--glow-light),
        0 0 16px var(--glow-light),
        0 0 32px var(--glow-strong),
        0 0 60px var(--glow-strong);
      pointer-events: none;
      user-select: none;
      opacity: 0;
      animation: fadeIn 2.5s ease 0.6s forwards, glowPulse 3s ease-in-out 3s infinite;
    }

    @keyframes fadeIn { to { opacity: 1; } }
    @keyframes glowPulse {
      0%, 100% { filter: brightness(1); }
      50% { filter: brightness(1.25); }
    }
  </style>

  <!-- Import map: Three.js + addons qua CDN -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <canvas id="scene"></canvas>
  <!-- ====== ĐỔI DÒNG CHỮ TẠI ĐÂY ====== -->
  <div id="message">Chào xinh gái nhóa</div>

  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
    import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
    import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
    import { OutputPass } from "three/addons/postprocessing/OutputPass.js";

    // ---------------------------------------------------------------
    // Cấu hình chung
    // ---------------------------------------------------------------
    const CONFIG = {
      colorLight: new THREE.Color("#ff9ecf"), // hồng phấn
      colorDeep: new THREE.Color("#ff2e88"),  // hồng đậm
      heartParticlesDesktop: 28000,
      heartParticlesMobile: 15000,
      sparkleCount: 600,
      starCount: 1200,
      autoRotateSpeed: 0.8,
      beatPeriod: 1.0, // giây cho một nhịp tim
      bloom: { strength: 1.1, radius: 0.5, threshold: 0.06 },
    };

    const isSmallScreen = Math.min(window.innerWidth, window.innerHeight) < 600;
    const heartParticleCount = isSmallScreen ? CONFIG.heartParticlesMobile : CONFIG.heartParticlesDesktop;

    // ---------------------------------------------------------------
    // Renderer, scene, camera
    // ---------------------------------------------------------------
    const canvas = document.getElementById("scene");
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: "high-performance" });
    const pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
    renderer.setPixelRatio(pixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x000000, 1);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color("#05010a"); // nền tím than rất tối
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 200);

    // Đặt khoảng cách camera để trái tim vừa màn hình (cả dọc lẫn ngang)
    function fitCameraDistance() {
      const heartRadius = 1.6;
      const vFov = THREE.MathUtils.degToRad(camera.fov);
      const distV = heartRadius / Math.tan(vFov / 2);
      const distH = heartRadius / (Math.tan(vFov / 2) * camera.aspect);
      return Math.max(distV, distH) * 1.15;
    }
    camera.position.set(0, 0.25, fitCameraDistance());

    // ---------------------------------------------------------------
    // Điều khiển xoay / zoom (chuột + cảm ứng)
    // ---------------------------------------------------------------
    const controls = new OrbitControls(camera, canvas);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.enablePan = false;
    controls.autoRotate = true; // tự xoay quanh trục Y, tiếp tục sau khi thả tay
    controls.autoRotateSpeed = CONFIG.autoRotateSpeed;
    controls.minDistance = 2.5;
    controls.maxDistance = 14;
    controls.target.set(0, 0.1, 0);

    // ---------------------------------------------------------------
    // Hàm trái tim 3D: (x² + 9/4·y² + z² − 1)³ − x²z³ − 9/80·y²z³ = 0
    // (z là trục đứng trong phương trình → map sang trục Y của Three.js)
    // ---------------------------------------------------------------
    function heartImplicit(x, y, z) {
      const a = x * x + 2.25 * y * y + z * z - 1;
      return a * a * a - x * x * z * z * z - 0.1125 * y * y * z * z * z;
    }

    // Tìm bán kính bề mặt theo một hướng (dò bước rồi chia đôi cho chính xác)
    function surfaceRadius(dx, dy, dz) {
      const step = 0.04;
      let r = step;
      while (r < 2 && heartImplicit(dx * r, dy * r, dz * r) <= 0) r += step;
      let lo = r - step, hi = r;
      for (let i = 0; i < 12; i++) {
        const mid = (lo + hi) / 2;
        if (heartImplicit(dx * mid, dy * mid, dz * mid) <= 0) lo = mid; else hi = mid;
      }
      return lo;
    }

    // Hướng ngẫu nhiên đều trên mặt cầu
    function randomDirection() {
      const u = Math.random() * 2 - 1;
      const theta = Math.random() * Math.PI * 2;
      const s = Math.sqrt(1 - u * u);
      return [s * Math.cos(theta), s * Math.sin(theta), u];
    }

    // ---------------------------------------------------------------
    // Shader dùng chung cho hạt: điểm tròn mềm, rung nhẹ, additive
    // ---------------------------------------------------------------
    const particleVertexShader = /* glsl */ `
      uniform float uTime;
      uniform float uPixelRatio;
      uniform float uJitter;
      attribute float aSize;
      attribute float aPhase;
      attribute vec3 aColor;
      varying vec3 vColor;
      varying float vTwinkle;

      void main() {
        vec3 p = position;
        // Rung nhẹ mỗi hạt với pha riêng
        p += uJitter * vec3(
          sin(uTime * 2.1 + aPhase * 6.28),
          cos(uTime * 1.7 + aPhase * 12.1),
          sin(uTime * 2.6 + aPhase * 3.7)
        );
        vec4 mvPosition = modelViewMatrix * vec4(p, 1.0);
        gl_Position = projectionMatrix * mvPosition;
        gl_PointSize = aSize * uPixelRatio * (8.0 / -mvPosition.z);
        vColor = aColor;
        vTwinkle = 0.75 + 0.25 * sin(uTime * 3.0 + aPhase * 40.0);
      }
    `;

    const particleFragmentShader = /* glsl */ `
      uniform float uOpacity;
      varying vec3 vColor;
      varying float vTwinkle;

      void main() {
        float d = length(gl_PointCoord - 0.5);
        if (d > 0.5) discard;
        float alpha = smoothstep(0.5, 0.0, d);
        gl_FragColor = vec4(vColor * vTwinkle, alpha * uOpacity);
      }
    `;

    function createParticleMaterial({ jitter, opacity }) {
      return new THREE.ShaderMaterial({
        uniforms: {
          uTime: { value: 0 },
          uPixelRatio: { value: pixelRatio },
          uJitter: { value: jitter },
          uOpacity: { value: opacity },
        },
        vertexShader: particleVertexShader,
        fragmentShader: particleFragmentShader,
        transparent: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
      });
    }

    // ---------------------------------------------------------------
    // Trái tim chính: dày ở bề mặt, thưa dần vào trong
    // ---------------------------------------------------------------
    function createHeart(count) {
      const positions = new Float32Array(count * 3);
      const colors = new Float32Array(count * 3);
      const sizes = new Float32Array(count);
      const phases = new Float32Array(count);
      const tmpColor = new THREE.Color();
      const heartScale = 1.25;

      for (let i = 0; i < count; i++) {
        const [dx, dy, dz] = randomDirection();
        const rSurface = surfaceRadius(dx, dy, dz);

        // 70% hạt bám sát bề mặt, 30% rải vào trong (mật độ giảm dần)
        const depth = Math.random() < 0.7
          ? 1 - Math.random() * 0.06
          : 1 - Math.pow(Math.random(), 1.8) * 0.85;
        const r = rSurface * depth;

        // Phương trình (x, y, z) → Three.js (x, z, y)
        positions[i * 3] = dx * r * heartScale;
        positions[i * 3 + 1] = dz * r * heartScale;
        positions[i * 3 + 2] = dy * r * heartScale;

        // Bề mặt hồng phấn, càng vào trong càng hồng đậm (+ chút ngẫu nhiên)
        const mixValue = THREE.MathUtils.clamp((1 - depth) * 1.6 + Math.random() * 0.45, 0, 1);
        tmpColor.copy(CONFIG.colorLight).lerp(CONFIG.colorDeep, mixValue);
        colors[i * 3] = tmpColor.r;
        colors[i * 3 + 1] = tmpColor.g;
        colors[i * 3 + 2] = tmpColor.b;

        sizes[i] = 0.5 + Math.random() * 0.9;
        phases[i] = Math.random();
      }

      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute("position", new THREE.BufferAttribute(positions, 3));
      geometry.setAttribute("aColor", new THREE.BufferAttribute(colors, 3));
      geometry.setAttribute("aSize", new THREE.BufferAttribute(sizes, 1));
      geometry.setAttribute("aPhase", new THREE.BufferAttribute(phases, 1));

      const opacity = isSmallScreen ? 1.0 : 0.7;
      return new THREE.Points(geometry, createParticleMaterial({ jitter: 0.008, opacity }));
    }

    // ---------------------------------------------------------------
    // Tia lấp lánh bay lơ lửng quanh trái tim
    // ---------------------------------------------------------------
    function createSparkles(count) {
      const basePositions = new Float32Array(count * 3);
      const colors = new Float32Array(count * 3);
      const sizes = new Float32Array(count);
      const phases = new Float32Array(count);
      const speeds = new Float32Array(count);
      const tmpColor = new THREE.Color();

      for (let i = 0; i < count; i++) {
        const [dx, dy, dz] = randomDirection();
        const r = 1.4 + Math.random() * 1.6;
        basePositions[i * 3] = dx * r;
        basePositions[i * 3 + 1] = dz * r * 0.9;
        basePositions[i * 3 + 2] = dy * r;

        tmpColor.copy(CONFIG.colorLight).lerp(new THREE.Color("#ffffff"), Math.random() * 0.5);
        colors[i * 3] = tmpColor.r;
        colors[i * 3 + 1] = tmpColor.g;
        colors[i * 3 + 2] = tmpColor.b;

        sizes[i] = 0.8 + Math.random() * 1.6;
        phases[i] = Math.random();
        speeds[i] = 0.08 + Math.random() * 0.2;
      }

      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute("position", new THREE.BufferAttribute(basePositions.slice(), 3));
      geometry.setAttribute("aColor", new THREE.BufferAttribute(colors, 3));
      geometry.setAttribute("aSize", new THREE.BufferAttribute(sizes, 1));
      geometry.setAttribute("aPhase", new THREE.BufferAttribute(phases, 1));

      const points = new THREE.Points(geometry, createParticleMaterial({ jitter: 0.05, opacity: 0.9 }));
      points.userData = { basePositions, phases, speeds };
      return points;
    }

    // Cập nhật vị trí tia lấp lánh: bay lên chậm rồi quay lại vòng lặp
    function updateSparkles(points, time) {
      const { basePositions, phases, speeds } = points.userData;
      const position = points.geometry.attributes.position;
      for (let i = 0; i < phases.length; i++) {
        const lift = ((time * speeds[i] + phases[i]) % 1) * 1.2 - 0.6;
        position.array[i * 3] = basePositions[i * 3] + Math.sin(time * 0.5 + phases[i] * 20) * 0.12;
        position.array[i * 3 + 1] = basePositions[i * 3 + 1] + lift;
        position.array[i * 3 + 2] = basePositions[i * 3 + 2] + Math.cos(time * 0.4 + phases[i] * 15) * 0.12;
      }
      position.needsUpdate = true;
    }

    // ---------------------------------------------------------------
    // Nền sao xa
    // ---------------------------------------------------------------
    function createStars(count) {
      const positions = new Float32Array(count * 3);
      const colors = new Float32Array(count * 3);
      const sizes = new Float32Array(count);
      const phases = new Float32Array(count);
      for (let i = 0; i < count; i++) {
        const [dx, dy, dz] = randomDirection();
        const r = 40 + Math.random() * 50;
        positions[i * 3] = dx * r;
        positions[i * 3 + 1] = dy * r;
        positions[i * 3 + 2] = dz * r;
        const tint = 0.55 + Math.random() * 0.35;
        colors[i * 3] = tint;
        colors[i * 3 + 1] = tint * 0.9;
        colors[i * 3 + 2] = tint;
        sizes[i] = 4 + Math.random() * 6;
        phases[i] = Math.random();
      }
      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute("position", new THREE.BufferAttribute(positions, 3));
      geometry.setAttribute("aColor", new THREE.BufferAttribute(colors, 3));
      geometry.setAttribute("aSize", new THREE.BufferAttribute(sizes, 1));
      geometry.setAttribute("aPhase", new THREE.BufferAttribute(phases, 1));
      return new THREE.Points(geometry, createParticleMaterial({ jitter: 0, opacity: 0.5 }));
    }

    // ---------------------------------------------------------------
    // Lắp ráp scene
    // ---------------------------------------------------------------
    const heartGroup = new THREE.Group();
    heartGroup.position.y = 0.1;
    const heart = createHeart(heartParticleCount);
    const sparkles = createSparkles(isSmallScreen ? CONFIG.sparkleCount / 2 : CONFIG.sparkleCount);
    heartGroup.add(heart);
    scene.add(heartGroup, sparkles);
    const stars = createStars(isSmallScreen ? CONFIG.starCount / 2 : CONFIG.starCount);
    scene.add(stars);

    // ---------------------------------------------------------------
    // Hậu kỳ: bloom để hạt phát sáng
    // ---------------------------------------------------------------
    const composer = new EffectComposer(renderer);
    composer.setPixelRatio(pixelRatio);
    composer.setSize(window.innerWidth, window.innerHeight);
    composer.addPass(new RenderPass(scene, camera));
    const bloomPass = new UnrealBloomPass(
      new THREE.Vector2(window.innerWidth, window.innerHeight),
      CONFIG.bloom.strength,
      CONFIG.bloom.radius,
      CONFIG.bloom.threshold
    );
    composer.addPass(bloomPass);
    composer.addPass(new OutputPass());

    // ---------------------------------------------------------------
    // Nhịp tim: hai nhịp "thình-thịch" rồi nghỉ, giống tim thật
    // ---------------------------------------------------------------
    function heartbeatScale(time) {
      const t = (time % CONFIG.beatPeriod) / CONFIG.beatPeriod;
      const firstBeat = Math.exp(-Math.pow((t - 0.12) / 0.06, 2)) * 0.09;
      const secondBeat = Math.exp(-Math.pow((t - 0.34) / 0.07, 2)) * 0.055;
      return 1 + firstBeat + secondBeat;
    }

    // ---------------------------------------------------------------
    // Resize
    // ---------------------------------------------------------------
    function handleResize() {
      const width = window.innerWidth;
      const height = window.innerHeight;
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
      renderer.setSize(width, height);
      composer.setSize(width, height);
      bloomPass.resolution.set(width, height);
    }
    window.addEventListener("resize", handleResize);

    // ---------------------------------------------------------------
    // Vòng lặp animation
    // ---------------------------------------------------------------
    const clock = new THREE.Clock();
    const materials = [heart.material, sparkles.material, stars.material];

    function animate() {
      const elapsed = clock.getElapsedTime();
      for (const material of materials) material.uniforms.uTime.value = elapsed;

      heartGroup.scale.setScalar(heartbeatScale(elapsed));
      updateSparkles(sparkles, elapsed);
      stars.rotation.y = elapsed * 0.005;

      controls.update();
      composer.render();
      requestAnimationFrame(animate);
    }
    animate();
  </script>
</body>
</html>
